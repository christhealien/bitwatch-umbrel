name: image
# Push a tag like bitwatch-v1.0.0 to build the Bitwatch image (amd64 + arm64): zapomatic/bitwatch at UPSTREAM_REF with
# tools/patch.py applied (Gotify alerts + blake2b look), published to ghcr.io/<owner>/blake2b-bitwatch, then the app
# folder is copied into the store repo <owner>/Bitcoin-Umbrel-APPS (needs the STORE_TOKEN secret; without it the
# store's own sync-apps workflow picks the release up).
on:
  push:
    tags: ["bitwatch-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (e.g. 1.0.0)"
        required: true
permissions:
  contents: read
  packages: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  UPSTREAM_REPO: zapomatic/bitwatch
  STORE_REPO: Bitcoin-Umbrel-APPS
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#bitwatch-v}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $v" >&2; exit 1; }
          grep -q "image: ghcr.io/.*/blake2b-bitwatch:$v\$" blake2b-bitwatch/docker-compose.yml || { echo "docker-compose.yml does not use image tag $v" >&2; exit 1; }
          grep -q "^version: \"$v\"" blake2b-bitwatch/umbrel-app.yml || { echo "umbrel-app.yml version is not $v" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "ref=$(tr -d '[:space:]' < UPSTREAM_REF)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ours
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.prepare.outputs.ref }}
          path: up
      - name: Add Gotify and the theme
        run: python3 -I ours/tools/patch.py up
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: up
          file: up/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/blake2b-bitwatch:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=bitwatch-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=bitwatch-${{ matrix.arch }}

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the amd64 and arm64 images
        env:
          IMG: ghcr.io/${{ github.repository_owner }}/blake2b-bitwatch
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          docker buildx imagetools create -t "$IMG:$VERSION" -t "$IMG:latest" "$IMG:$VERSION-amd64" "$IMG:$VERSION-arm64"

  store:
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the store repo
        env:
          STORE_TOKEN: ${{ secrets.STORE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          if [ -z "$STORE_TOKEN" ]; then echo "::notice::STORE_TOKEN is not set: the store's own sync-apps workflow will pick this release up"; exit 0; fi
          auth="$(printf 'x-access-token:%s' "$STORE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          if ! git -c "http.extraHeader=Authorization: Basic $auth" clone "https://github.com/$OWNER/$STORE_REPO.git" /tmp/store; then
            echo "::warning::Could not clone $OWNER/$STORE_REPO (check STORE_TOKEN). The store's sync-apps workflow will still pick this release up."
            exit 0
          fi
          cd /tmp/store
          for try in 1 2 3 4; do
            rm -rf blake2b-bitwatch
            cp -r "$GITHUB_WORKSPACE/blake2b-bitwatch" .
            git add -A
            git diff --cached --quiet && { echo "store already up to date"; exit 0; }
            git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -q -m "blake2b-bitwatch $VERSION"
            branch="$(git rev-parse --abbrev-ref HEAD)"
            if git -c "http.extraHeader=Authorization: Basic $auth" push origin "HEAD:$branch"; then exit 0; fi
            echo "push rejected (try $try), retrying on top of the newest store"
            git -c "http.extraHeader=Authorization: Basic $auth" fetch -q origin "$branch"
            git reset -q --hard "origin/$branch"
            sleep $((try * 5))
          done
          echo "::warning::Could not push to $OWNER/$STORE_REPO (token needs Contents: write). The store's sync-apps workflow will still pick this release up."
