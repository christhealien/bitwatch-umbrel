manifestVersion: 1
id: blake2b-bitwatch
name: Bitwatch (blake2b)
tagline: Watch your Bitcoin addresses and wallets, with alerts to Gotify
icon: https://raw.githubusercontent.com/christhealien/bitwatch-umbrel/master/blake2b-bitwatch/icon.svg
category: bitcoin
version: "1.0.1"
port: 8794
description: >-
  Bitwatch watches Bitcoin addresses, xpubs and descriptors, in the mempool and on-chain, and tells you when a
  balance changes. Group addresses into collections to total balances across wallets, and choose per direction
  (incoming, outgoing, mempool, confirmed) whether a change is accepted silently or raises an alert.


  This build adds Gotify: open Integrations, paste the token of an application you created in the Gotify
  (blake2b) app and save; a test message confirms it works. Alerts go to Gotify and, if you set it up, Telegram.
  The look matches the other apps in this store.


  It uses the Mempool (blake2b) app on this Umbrel for lookups, so your addresses never leave your node.
  Without that app installed, set the API to https://mempool.space under Configuration (less private).
developer: Zap-O-Matic (upstream); Gotify alerts, theme and packaging by christhealien
website: https://github.com/christhealien/bitwatch-umbrel
dependencies: []
repo: https://github.com/christhealien/bitwatch-umbrel
support: https://github.com/christhealien/bitwatch-umbrel/issues
submitter: christhealien
submission: https://github.com/christhealien/bitwatch-umbrel
releaseNotes: |-
  **1.0.1**

  - New installs start with no example addresses. The examples included Satoshi's genesis address, whose huge history makes your own Mempool/Electrs time out and drops the live connection.

  **1.0.0: first release**

  - Bitwatch 1.8.0 with Gotify alerts (Integrations page: server address, application token, priority, tap-to-open link).
  - Black and white look like the other apps in this store; status colours only for good, warning and failure.
  - Uses the Mempool (blake2b) app on this Umbrel by default.
path: ""
